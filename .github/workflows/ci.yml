# Runs the tests, coverage and mutation testing, and builds the app, on every push and pull request.
# On main it also refreshes the README's badges on the "badges" branch. Needs no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Third-party code in CI is GitHub's own actions only, each pinned to a commit so a moved tag can't change it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the Gradle wrapper is genuine
        run: |
          expected=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$(sed -n 's#.*gradle-\(.*\)-bin\.zip#\1#p' gradle/wrapper/gradle-wrapper.properties)-wrapper.jar.sha256")
          echo "$expected  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Use the runner's JDK 17 and the SDK versions the build pins
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Test, with coverage (core must stay at 100%)
        run: ./gradlew test :core:jacocoTestCoverageVerification :core:jacocoTestReport :app:createDebugUnitTestCoverageReport

      - name: Mutation-test the core (fails if any mutant survives)
        run: ./gradlew :core:pitest

      - name: Build
        run: ./gradlew assembleDebug assembleRelease

      - name: Draw the badges
        if: github.event_name == 'push'
        run: python3 -I .github/scripts/badges.py badges

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: badges
          path: badges/
          retention-days: 1

  # Kept apart from the build so the job that can write to the repo never runs project code.
  badges:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: badges
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: badges
          path: badges

      - name: Replace the badges branch with the new badges
        working-directory: badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Badges for $GITHUB_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
